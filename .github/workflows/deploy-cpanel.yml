name: Deploy cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gp-mirari-cpanel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.CPANEL_FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/backups/**
            **/functions/**
            **/migrations/**
            **/supabase/**
            **/tests/**
            **/*.zip
            .cpanel.yml
            package.json
            supabase-config.example.js
